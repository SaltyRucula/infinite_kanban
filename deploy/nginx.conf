# AI Agent Board ingress: serve the SPA and reverse-proxy the API + WebSocket
# to the server container. `Host` is preserved so the server's ALLOWED_HOSTS /
# ALLOWED_ORIGINS WebSocket allowlist sees the real client host.
server {
    listen 80;
    server_name _;

    # Attachment uploads (images) can exceed nginx's 1m default.
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # REST API
    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebSocket (live agent/task events)
    location /ws {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
