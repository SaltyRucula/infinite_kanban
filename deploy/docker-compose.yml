# AI Agent Board — Docker Compose deployment stack.
# Usage (on the host):
#   docker compose --env-file .env up -d --build
# Secrets and host-specific values live in deploy/.env (see .env.example).
services:
  db:
    image: postgres:16-alpine
    container_name: ai-agent-board-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: agentboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentboard -d agentboard"]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: ai-agent-board-server:latest
    container_name: ai-agent-board-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      DATABASE_URL: postgresql://agentboard:${POSTGRES_PASSWORD}@db:5432/agentboard
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      # Persisted server config + clone root (agent working dirs).
      AGENTBOARD_HOME: /data/agentboard
      # API_KEY intentionally unset -> open access on the private network.
      # To require auth, set API_KEY here AND rebuild the web image with a
      # matching VITE_API_KEY build arg.
      # SERVICE_TOKENS: scoped credentials (e.g. workers:register) that gate
      # only the narrow orchestration/worker-registration surface without
      # touching the browser UI or requiring a client rebuild. Set in
      # deploy/.env; passed through only if non-empty there.
      SERVICE_TOKENS: ${SERVICE_TOKENS:-}
    volumes:
      - serverdata:/data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: ai-agent-board-web:latest
    container_name: ai-agent-board-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    ports:
      - "80:80"

volumes:
  pgdata:
  serverdata:
